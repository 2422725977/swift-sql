# SwiftSQL Profile: 3B High-Speed Full-Precision bf16 (L4 22GB Full Utilization)
# Optimized for: Colab Pro L4 (22GB) / A100 -> Apple Silicon 16GB (Q8_0 ~3.6GB, ultra-fast concurrency)

project:
  name: "swiftsql-3b"
  run_tag: "opt2"
  seed: 42

model:
  base_model: "Qwen/Qwen2.5-Coder-3B-Instruct"
  max_seq_length: 2048
  # 3B fits comfortably in pure bf16 on L4 (22GB) -> zero 4-bit quantization noise + faster training!
  load_in_4bit: false

lora:
  r: 64
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  # Expanded ~18k+ sandbox-verified multi-task dataset
  gretel_train_samples: 12000
  sqale_train_samples: 4500
  chinese_train_samples: 3500
  eval_samples: 450
  max_schema_chars: 4000
  verify_executable: true
  repair_ratio: 0.20
  refusal_ratio: 0.12
  dialect_weights:
    postgresql: 0.40
    mysql: 0.35
    sqlite: 0.25

sft:
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  packing: true
  learning_rate: 1.5e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  bf16: true

dpo:
  # RPO-stabilized Iterative Execution-Guided DPO (high-utilization L4 batches)
  rounds: 2
  eval_samples: 300
  eval_batch_size: 32
  sample_batch_size: 12
  num_prompts_per_round: 1400
  candidates_per_round: [4, 6]
  round_learning_rates: [1.0e-5, 5.0e-6]
  round_betas: [0.20, 0.25]
  rpo_alpha: 0.5
  max_grad_norm: 0.5
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4

export:
  quantizations:
    - "q8_0"     # ~3.6GB for 3B, near-lossless accuracy on 16GB Mac mini
    - "q4_k_m"   # ~2.2GB for 3B, ultra-fast high-concurrency mode
